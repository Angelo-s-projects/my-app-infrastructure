services:
  public-assets:
    image: ghcr.io/angelovanosch1/my-app-backend:latest
    command: ["sh", "-c", "cp -a /var/www/html/public/. /public/"]
    volumes:
      - laravel_public:/public
  app:
    image: ghcr.io/angelovanosch1/my-app-backend:latest
    volumes:
      - laravel_public:/var/www/html/public:ro
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: my_app
      DB_USERNAME: my_app
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - laravel_public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      public-assets:
        condition: service_completed_successfully
  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: my_app
      MYSQL_USER: my_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  laravel_public: